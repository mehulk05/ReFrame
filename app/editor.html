<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReFrame — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090a;--panel:#0e0f11;--panel-2:#121315;--elev:#16171a;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.11);
    --txt:#ededef;--txt-2:#b4b5bd;--muted:#7c7d87;--faint:#56575f;
    --accent:#5e6ad2;--accent-2:#6872e5;--accent-soft:rgba(94,106,210,.14);
    --danger:#eb5757;--danger-soft:rgba(235,87,87,.13);
    --r:10px;--r-lg:14px;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{margin:0;font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;line-height:1.5;
    background-image:radial-gradient(800px 500px at 100% -5%,rgba(94,106,210,.08),transparent 60%)}
  a{color:inherit}
  header{padding:0 28px;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
    background:rgba(8,9,10,.72);backdrop-filter:saturate(140%) blur(14px)}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);transition:.13s}
  .back:hover{color:var(--txt);border-color:var(--line-2)}
  .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(140deg,var(--accent),#8b94f0);display:flex;align-items:center;justify-content:center}
  .mark svg{width:13px;height:13px}
  .logo{font-weight:600;font-size:14px}
  .tag{color:var(--muted);font-size:13px}
  .wrap{display:grid;grid-template-columns:1fr 320px;gap:24px;padding:28px;align-items:start;max-width:1320px;margin:0 auto}
  /* preview */
  .stagewrap{position:relative}
  .stage{position:relative;background:linear-gradient(180deg,#0c0d0f,#090a0b);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:420px;box-shadow:var(--shadow)}
  .stage video{max-width:100%;max-height:64vh;display:block}
  #caps{position:absolute;top:0;left:0;pointer-events:none}
  #caps .cap{position:absolute;transform:translate(-50%,-50%);font-weight:700;text-align:center;white-space:pre-wrap;text-shadow:0 2px 12px rgba(0,0,0,.6);line-height:1.2;cursor:move;pointer-events:auto;max-width:92%;padding:2px 6px;touch-action:none}
  #caps .cap.active{outline:2px dashed rgba(94,106,210,.95);outline-offset:3px;border-radius:5px}
  .capitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);margin-bottom:6px;font-size:12px;color:var(--txt-2);cursor:pointer}
  .capitem.active{border-color:rgba(94,106,210,.6);background:var(--accent-soft);color:#cdd2f7}
  .capitem .x{cursor:pointer;color:var(--muted);border:none;background:none;font-size:13px;font-family:inherit}
  .capitem .x:hover{color:var(--danger)}
  /* annotation overlay */
  #annot{position:absolute;top:0;left:0;pointer-events:none}
  #annot .anode{position:absolute;cursor:move;touch-action:none;pointer-events:auto}
  #annot .anode.box{border:3px solid currentColor;border-radius:4px}
  #annot .anode .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid currentColor;border-radius:3px}
  #annot .anode .h.br{right:-8px;bottom:-8px;cursor:nwse-resize}
  #annot .anode .h.tip{right:-8px;top:-8px;cursor:move}
  #annot .anode .del{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
  #annot svg{position:absolute;overflow:visible;pointer-events:none}
  .cutband{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(235,87,87,.22),rgba(235,87,87,.22) 6px,rgba(235,87,87,.34) 6px,rgba(235,87,87,.34) 12px);border-left:2px solid var(--danger);border-right:2px solid var(--danger);cursor:move;touch-action:none}
  .cutband .ce{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
  .cutband .ce.l{left:-4px}.cutband .ce.r{right:-4px}
  .cutband .cdel{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2}
  .drawcut{position:absolute;top:0;bottom:0;background:rgba(235,87,87,.28);border:1px dashed var(--danger);pointer-events:none}
  #wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
  .track.cutmode{cursor:crosshair}
  .cutbtn{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.13s}
  .cutbtn:hover{border-color:var(--line-2);color:var(--txt)}
  .cutbtn.on{background:var(--danger-soft);color:#ff9a9a;border-color:rgba(235,87,87,.5)}
  .seg{display:flex;gap:6px}.seg .chip{flex:1}
  .miniact{display:flex;gap:6px;flex-wrap:wrap}
  .miniact button{flex:1;min-width:84px;padding:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt-2);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:.13s}
  .miniact button:hover{border-color:var(--line-2);color:var(--txt)}
  .checks{display:flex;flex-direction:column;gap:8px}
  .checks label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--txt-2);cursor:pointer}
  .checks input{width:16px;height:16px;accent-color:var(--accent)}
  /* timeline */
  .timeline{margin-top:16px}
  .tcontrols{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .play{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s}
  .play:hover{border-color:var(--line-2)}
  .play svg{width:16px;height:16px}
  .times{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .times b{color:var(--txt-2);font-weight:600}
  .track{position:relative;height:46px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;touch-action:none}
  .sel{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
  .handle{position:absolute;top:-3px;width:14px;height:52px;background:var(--accent);border-radius:5px;cursor:ew-resize;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .handle:after{content:"";width:2px;height:18px;background:rgba(255,255,255,.7);border-radius:2px}
  .playhead{position:absolute;top:-3px;width:2px;height:52px;background:#fff;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.6)}
  /* panel */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow)}
  .sec{padding:16px}.sec+.sec{border-top:1px solid var(--line)}
  .panel h2{margin:0 0 14px;font-size:11px;font-weight:590;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:500}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  input[type=text],select{width:100%;padding:9px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-size:13px;font-family:inherit}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);cursor:pointer}
  .val{font-size:12px;color:var(--txt-2);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)}
  .sw{position:relative;width:36px;height:21px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:#2a2b30;border-radius:20px;transition:.18s;cursor:pointer;border:1px solid var(--line)}
  .sw span:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:2.5px;background:#fff;border-radius:50%;transition:.18s}
  .sw input:checked+span{background:var(--accent);border-color:var(--accent)}
  .sw input:checked+span:before{transform:translateX(15px)}
  .chips{display:flex;gap:6px}
  .chip{flex:1;text-align:center;padding:7px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;color:var(--txt-2);transition:.13s}
  .chip.on{background:var(--accent-soft);color:#cdd2f7;border-color:rgba(94,106,210,.5);font-weight:600}
  button.action{width:100%;padding:10px 12px;border:1px solid transparent;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:.13s}
  .btn-primary{background:#fff;color:#0a0a0a}.btn-primary:hover{background:#e4e4e7}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .reset{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit}
  .reset:hover{color:var(--txt-2)}
  .status{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
  .bar{height:5px;background:#26272c;border-radius:6px;overflow:hidden;margin-top:8px;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
  .loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Back</a>
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9v6M21 9v6"/></svg></div>
  <div class="logo">ReFrame</div><span class="tag">Editor</span>
</header>

<div id="app"><div class="loading">Loading clip…</div></div>

<template id="tpl">
<div class="wrap">
  <div class="stagewrap">
    <div class="stage">
      <video id="vid" playsinline></video>
      <div id="caps"></div>
      <div id="annot"></div>
    </div>
    <div class="timeline">
      <div class="tcontrols">
        <button class="play" id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="times"><b id="curT">0:00</b> / <span id="durT">0:00</span> &nbsp;·&nbsp; Trim: <b id="inT">0:00</b> → <b id="outT">0:00</b> <span id="selLen"></span></div>
      </div>
      <div class="track" id="track">
        <canvas id="wave"></canvas>
        <div class="sel" id="sel"></div>
        <div id="cuts"></div>
        <div class="drawcut" id="drawcut" style="display:none"></div>
        <div class="playhead" id="ph"></div>
        <div class="handle" id="hIn" style="left:0"></div>
        <div class="handle" id="hOut" style="right:0"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="sec">
      <h2>Captions <button class="reset" id="addCap" style="float:right">+ Add caption</button></h2>
      <div id="capList"></div>
      <div id="capEdit" style="display:none">
        <div class="field"><input type="text" id="capText" placeholder="Caption text…"></div>
        <div class="field"><label>Size</label><div class="row"><input type="range" id="capSize" min="3" max="16" value="6" step="0.5"><span class="val" id="capSizeV">6%</span></div></div>
        <div class="field"><div class="row"><label style="margin:0">Color</label><input type="color" id="capColor" value="#ffffff"></div></div>
        <div class="field"><label>Show from → to (seconds)</label>
          <div class="row" style="justify-content:flex-start;gap:8px">
            <input type="number" id="capStartN" min="0" step="0.1" style="width:84px">
            <span style="color:var(--muted)">→</span>
            <input type="number" id="capEndN" min="0" step="0.1" style="width:84px">
          </div>
          <div class="miniact" style="margin-top:8px"><button id="capStart">Set start = playhead</button><button id="capEnd">Set end = playhead</button></div>
          <p class="status" id="capRange" style="text-align:left;margin-top:6px"></p>
        </div>
        <p class="status" style="text-align:left">Drag the caption on the video to position it.</p>
      </div>
      <p class="status" id="capHint" style="text-align:left">No captions yet. Click <b>+ Add caption</b>, then drag it on the video and set when it shows.</p>
    </div>

    <div class="sec">
      <h2>Annotations</h2>
      <div class="miniact">
        <button id="addBox">+ Box</button>
        <button id="addArrow">+ Arrow</button>
        <input type="color" id="annColor" value="#ff5d5d" style="width:38px">
      </div>
      <p class="status" style="text-align:left;margin-top:8px">Drag to position · corner to resize · ✕ to remove. Baked into the export.</p>
    </div>

    <div class="sec">
      <h2>Cut <button class="reset" id="clearCut" style="float:right;display:none">Clear all</button></h2>
      <button id="cutMode" class="cutbtn">✂ Drag-to-cut: Off</button>
      <p class="status" id="cutInfo" style="text-align:left;margin-top:8px">Turn on, then drag across the timeline to remove a section. Drag a red block to move it, its edges to trim, ✕ to delete. Add as many as you like.</p>
    </div>

    <div class="sec">
      <h2>Speed</h2>
      <div class="chips" id="speed">
        <div class="chip" data-s="0.5">0.5×</div>
        <div class="chip on" data-s="1">1×</div>
        <div class="chip" data-s="1.5">1.5×</div>
        <div class="chip" data-s="2">2×</div>
        <div class="chip" data-s="custom">Custom</div>
      </div>
      <div class="field" id="customSpeedField" style="display:none;margin-top:10px">
        <div class="row"><label style="margin:0">Custom speed ×</label><input type="number" id="customSpeed" min="0.1" max="8" step="0.1" value="1" style="width:96px"></div>
      </div>
    </div>

    <div class="sec">
      <h2>Audio</h2>
      <div class="toggle"><div>Mute audio</div><label class="sw"><input type="checkbox" id="mute"><span></span></label></div>
      <div class="field" style="margin-top:12px"><label>Volume</label><div class="row"><input type="range" id="vol" min="0" max="2" value="1" step="0.05"><span class="val" id="volV">100%</span></div></div>
    </div>

    <div class="sec">
      <h2>Adjust <button class="reset" id="resetAdj" style="float:right">Reset</button></h2>
      <div class="field"><label>Brightness</label><div class="row"><input type="range" id="bri" min="0.5" max="1.8" value="1" step="0.02"><span class="val" id="briV">100%</span></div></div>
      <div class="field"><label>Contrast</label><div class="row"><input type="range" id="con" min="0.5" max="1.8" value="1" step="0.02"><span class="val" id="conV">100%</span></div></div>
      <div class="field"><label>Saturation</label><div class="row"><input type="range" id="sat" min="0" max="2" value="1" step="0.02"><span class="val" id="satV">100%</span></div></div>
    </div>

    <div class="sec">
      <h2>Export ratios</h2>
      <div class="checks" id="ratios">
        <label><input type="checkbox" value="original" checked> Original (keep as-is)</label>
        <label><input type="checkbox" value="9:16"> 9:16 · vertical</label>
        <label><input type="checkbox" value="1:1"> 1:1 · square</label>
        <label><input type="checkbox" value="4:5"> 4:5 · portrait</label>
        <label><input type="checkbox" value="16:9"> 16:9 · landscape</label>
      </div>
      <p class="status" style="text-align:left;margin-top:8px">Pick one or many — each is rendered and saved separately. Reframed with a blurred fill.</p>
    </div>

    <div class="sec">
      <button class="action btn-primary" id="export">Export edited clip</button>
      <div class="bar" id="bar"><i></i></div>
      <div class="status" id="status">Edits re-encode and save back to Recordings.</div>
    </div>
  </div>
</div>
</template>

<script>
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const clipId=+qs.get('id');

/* shared IndexedDB ('reframe') */
let db=null;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('reframe',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=(m,fn)=>{const t=db.transaction('clips',m);const s=t.objectStore('clips');return new Promise((res,rej)=>{const rq=fn(s);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);});};
const getClip=id=>tx('readonly',s=>s.get(id));
const putClip=c=>tx('readwrite',s=>s.put(c));

const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');};

// state
let clip=null, vid=null, dur=0, inT=0, outT=0;
let speed=1, playing=false;
let captions=[], selCap=null;        // [{id,text,x,y,size,color,start,end}]
let cuts=[];                         // #19 removed regions [{start,end}] seconds
let cutMode=false;                   // drag-to-cut active
let annotations=[];                  // #21 [{type,x,y,w,h,color}] fractions of video box

(async function init(){
  db=await openDB();
  clip=await getClip(clipId);
  if(!clip){ $('#app').innerHTML='<div class="loading">Clip not found. <a href="index.html">Go back</a></div>'; return; }
  $('#app').innerHTML=''; $('#app').appendChild(document.getElementById('tpl').content.cloneNode(true));
  // pre-load retake discards as cuts (from live "scratch that")
  if(clip.retakeCuts && clip.retakeCuts.length) cuts=clip.retakeCuts.map(c=>({start:c.start,end:c.end}));
  vid=$('#vid'); vid.src=URL.createObjectURL(clip.blob);
  vid.addEventListener('loadedmetadata', ()=>{
    dur=vid.duration && isFinite(vid.duration) ? vid.duration : 0;
    // some webm blobs report Infinity duration until seeked
    if(!dur || dur===Infinity){ vid.currentTime=1e7; vid.addEventListener('seeked',function f(){dur=vid.duration;vid.currentTime=0;vid.removeEventListener('seeked',f);outT=dur;updateCutInfo();refresh();},{once:true}); }
    outT=dur; updateCutInfo(); refresh();
  });
  wire();
  drawWaveform();
  renderCapList();
})();

/* ---------- waveform (decode audio → peaks → draw) ---------- */
let wavePeaks=null;
async function drawWaveform(){
  const cv=$('#wave'); if(!cv) return;
  try{
    if(!wavePeaks){
      const buf=await clip.blob.arrayBuffer();
      const actx=new (window.AudioContext||window.webkitAudioContext)();
      const audio=await actx.decodeAudioData(buf.slice(0));
      actx.close();
      const ch=audio.getChannelData(0), N=600, block=Math.floor(ch.length/N)||1, peaks=new Float32Array(N);
      for(let i=0;i<N;i++){ let mx=0; const s=i*block; for(let j=0;j<block;j++){ const v=Math.abs(ch[s+j]||0); if(v>mx)mx=v; } peaks[i]=mx; }
      const max=Math.max(...peaks)||1; for(let i=0;i<N;i++) peaks[i]/=max;
      wavePeaks=peaks;
    }
    paintWave();
  }catch(e){ /* no/undecodable audio — leave timeline plain */ }
}
function paintWave(){
  const cv=$('#wave'); if(!cv||!wavePeaks) return;
  const r=cv.getBoundingClientRect(); cv.width=Math.max(1,r.width); cv.height=Math.max(1,r.height);
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height, n=wavePeaks.length;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#8b94f0';
  for(let x=0;x<W;x++){ const p=wavePeaks[Math.floor(x/W*n)]||0; const h=Math.max(1,p*H*0.9); ctx.fillRect(x,(H-h)/2,1,h); }
}

function refresh(){
  $('#durT').textContent=fmt(dur);
  $('#inT').textContent=fmt(inT); $('#outT').textContent=fmt(outT);
  $('#selLen').textContent=`( ${fmt((outT-inT)/speed)} out )`;
  if(dur>0){
    $('#hIn').style.left=(inT/dur*100)+'%';
    $('#hOut').style.left=(outT/dur*100)+'%'; $('#hOut').style.right='auto';
    $('#sel').style.left=(inT/dur*100)+'%'; $('#sel').style.width=((outT-inT)/dur*100)+'%';
    renderCuts();
  }
  renderCaps(); renderAnnotations();
}

/* ---------- cuts (#19) ---------- */
function cutTotal(){ // seconds removed within the trim range
  return cuts.reduce((a,c)=>{ const s=Math.max(c.start,inT), e=Math.min(c.end,outT); return a+Math.max(0,e-s); },0);
}
function inCut(t){ const c=cuts.find(c=>t>=c.start && t<c.end); return c?c.end:null; }
function renderCuts(){
  const box=$('#cuts'); if(!box) return; box.innerHTML='';
  cuts.forEach((c,i)=>{
    const el=document.createElement('div'); el.className='cutband';
    el.style.left=(c.start/dur*100)+'%'; el.style.width=((c.end-c.start)/dur*100)+'%';
    el.innerHTML='<button class="cdel">✕</button><div class="ce l"></div><div class="ce r"></div>';
    el.querySelector('.cdel').onclick=ev=>{ev.stopPropagation(); cuts.splice(i,1); updateCutInfo(); refresh();};
    dragCut(el,c);
    box.appendChild(el);
  });
}
function dragCut(el,c){
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('cdel')) return;
    const edge=e.target.classList.contains('ce')?(e.target.classList.contains('l')?'l':'r'):null;
    const r=$('#track').getBoundingClientRect(); const sx=e.clientX; const c0={...c};
    const move=ev=>{
      const dt=(ev.clientX-sx)/r.width*dur;
      if(edge==='l') c.start=Math.min(Math.max(0,c0.start+dt),c.end-0.05);
      else if(edge==='r') c.end=Math.max(Math.min(dur,c0.end+dt),c.start+0.05);
      else { const w=c0.end-c0.start; c.start=Math.max(0,Math.min(c0.start+dt,dur-w)); c.end=c.start+w; }
      updateCutInfo(); refresh();
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    e.preventDefault(); e.stopPropagation();
  });
}
function updateCutInfo(){
  $('#clearCut').style.display=cuts.length?'inline':'none';
  const out=Math.max(0,(outT-inT)-cutTotal());
  $('#cutInfo').textContent = cuts.length
    ? `${cuts.length} cut(s) · ${cutTotal().toFixed(1)}s removed · final ≈ ${fmt(out/speed)}.`
    : 'Turn on, then drag across the timeline to remove a section. Drag a red block to move it, its edges to trim, ✕ to delete.';
}

/* ---------- annotations (#21) ---------- */
function renderAnnotations(){
  const box=$('#annot'); if(!box) return;
  const vx=vid.offsetLeft, vy=vid.offsetTop, vw=vid.clientWidth, vh=vid.clientHeight;
  box.style.left=vx+'px'; box.style.top=vy+'px'; box.style.width=vw+'px'; box.style.height=vh+'px';
  box.innerHTML='';
  annotations.forEach((a,i)=>{
    if(a.type==='box'){
      const n=document.createElement('div'); n.className='anode box'; n.style.color=a.color;
      n.style.left=(a.x*vw)+'px'; n.style.top=(a.y*vh)+'px'; n.style.width=(a.w*vw)+'px'; n.style.height=(a.h*vh)+'px';
      n.innerHTML='<button class="del">✕</button><div class="h br"></div>';
      box.appendChild(n);
      dragAnno(n, a, vw, vh, 'box');
    }else{
      const x1=a.x*vw, y1=a.y*vh, x2=(a.x+a.w)*vw, y2=(a.y+a.h)*vh;
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('width',vw); svg.setAttribute('height',vh); svg.style.color=a.color;
      const mid='m'+i;
      svg.innerHTML=`<defs><marker id="${mid}" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${a.color}"/></marker></defs>
        <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.color}" stroke-width="5" stroke-linecap="round" marker-end="url(#${mid})"/>`;
      box.appendChild(svg);
      // invisible drag nodes for tail and tip
      const tail=document.createElement('div'); tail.className='anode'; tail.style.cssText=`left:${x1-9}px;top:${y1-9}px;width:18px;height:18px;color:${a.color}`;
      tail.innerHTML='<button class="del">✕</button>';
      const tip=document.createElement('div'); tip.className='anode'; tip.style.cssText=`left:${x2-9}px;top:${y2-9}px;width:18px;height:18px;border:2px solid currentColor;border-radius:50%;color:${a.color}`;
      box.appendChild(tail); box.appendChild(tip);
      dragAnno(tail, a, vw, vh, 'arrowTail');
      dragAnno(tip, a, vw, vh, 'arrowTip');
    }
  });
}
function dragAnno(node, a, vw, vh, kind){
  const del=node.querySelector('.del');
  if(del) del.onclick=ev=>{ ev.stopPropagation(); annotations.splice(annotations.indexOf(a),1); renderAnnotations(); };
  node.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('del')) return;
    const resize=e.target.classList.contains('br');
    const sx=e.clientX, sy=e.clientY, a0={...a};
    const move=ev=>{
      const dx=(ev.clientX-sx)/vw, dy=(ev.clientY-sy)/vh;
      if(kind==='box' && resize){ a.w=Math.max(.03,a0.w+dx); a.h=Math.max(.03,a0.h+dy); }
      else if(kind==='arrowTip'){ a.w=a0.w+dx; a.h=a0.h+dy; }
      else { a.x=a0.x+dx; a.y=a0.y+dy; }   // move whole (box/arrow tail)
      renderAnnotations();
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    e.preventDefault(); e.stopPropagation();
  });
}

function filterStr(){return `brightness(${$('#bri').value}) contrast(${$('#con').value}) saturate(${$('#sat').value})`;}
function applyPreviewFilter(){ vid.style.filter=filterStr(); }

/* ---------- captions (timed + positioned) ---------- */
function capVisible(c){ return (!playing && selCap===c.id) || (vid && vid.currentTime>=c.start && vid.currentTime<c.end); }
function renderCaps(){
  const box=$('#caps'); if(!box) return;
  const vx=vid.offsetLeft, vy=vid.offsetTop, vw=vid.clientWidth, vh=vid.clientHeight;
  box.style.left=vx+'px'; box.style.top=vy+'px'; box.style.width=vw+'px'; box.style.height=vh+'px';
  box.innerHTML='';
  captions.forEach(c=>{
    const el=document.createElement('div'); el.className='cap'+(selCap===c.id?' active':'');
    el.textContent=c.text||' ';
    el.style.left=(c.x*vw)+'px'; el.style.top=(c.y*vh)+'px';
    el.style.color=c.color; el.style.fontSize=(vh*(c.size/100))+'px';
    el.style.display=capVisible(c)?'block':'none';
    el.addEventListener('pointerdown',e=>{
      // select WITHOUT rebuilding the caption nodes (rebuilding would detach the element mid-drag)
      selCap=c.id;
      box.querySelectorAll('.cap').forEach(x=>x.classList.remove('active')); el.classList.add('active');
      syncCapEditor(); renderCapList();
      const sx=e.clientX, sy=e.clientY, x0=c.x, y0=c.y;
      const move=ev=>{ c.x=Math.max(0,Math.min(1,x0+(ev.clientX-sx)/vw)); c.y=Math.max(0,Math.min(1,y0+(ev.clientY-sy)/vh));
        el.style.left=(c.x*vw)+'px'; el.style.top=(c.y*vh)+'px'; };
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
      e.preventDefault();
    });
    box.appendChild(el);
  });
}
function updateCapVis(){ // lightweight show/hide during playback (no rebuild)
  const els=$('#caps').children;
  captions.forEach((c,i)=>{ if(els[i]) els[i].style.display=capVisible(c)?'block':'none'; });
}
function renderCapList(){
  const box=$('#capList'); if(!box) return; box.innerHTML='';
  captions.forEach(c=>{
    const row=document.createElement('div'); row.className='capitem'+(selCap===c.id?' active':'');
    row.innerHTML=`<span>${(c.text||'(empty)').slice(0,20)} · ${fmt(c.start)}–${fmt(c.end)}</span><button class="x">✕</button>`;
    row.onclick=()=>{ selCap=c.id; syncCapEditor(); renderCapList(); renderCaps(); };
    row.querySelector('.x').onclick=ev=>{ ev.stopPropagation(); captions=captions.filter(z=>z!==c); if(selCap===c.id)selCap=null; syncCapEditor(); renderCapList(); renderCaps(); };
    box.appendChild(row);
  });
  $('#capHint').style.display=captions.length?'none':'block';
}
function selectedCap(){ return captions.find(c=>c.id===selCap); }
function syncCapEditor(){
  const c=selectedCap();
  $('#capEdit').style.display=c?'block':'none';
  if(!c) return;
  $('#capText').value=c.text; $('#capSize').value=c.size; $('#capSizeV').textContent=c.size+'%';
  $('#capColor').value=c.color;
  $('#capStartN').value=+c.start.toFixed(1); $('#capEndN').value=+c.end.toFixed(1);
  $('#capRange').textContent=`Shows ${fmt(c.start)} → ${fmt(c.end)}`;
}

function wire(){
  applyPreviewFilter();
  // play / pause within trim range
  $('#play').onclick=togglePlay;
  vid.addEventListener('timeupdate',()=>{
    if(vid.currentTime>=outT){ vid.pause(); vid.currentTime=inT; setPlaying(false); }
    const ce=inCut(vid.currentTime); if(ce!=null) vid.currentTime=ce;   // skip cuts in preview
    $('#curT').textContent=fmt(vid.currentTime);
    if(dur>0)$('#ph').style.left=(vid.currentTime/dur*100)+'%';
    updateCapVis();   // show/hide timed captions
  });
  vid.addEventListener('ended',()=>setPlaying(false));

  // trim handles
  dragHandle($('#hIn'),true); dragHandle($('#hOut'),false);
  // track: draw-to-cut when cut mode is on, otherwise scrub
  $('#track').addEventListener('pointerdown',e=>{
    if(e.target.closest('.handle')||e.target.closest('.cutband'))return;
    const r=$('#track').getBoundingClientRect();
    const tAt=x=>Math.max(0,Math.min(dur,(x-r.left)/r.width*dur));
    if(cutMode){
      const t0=tAt(e.clientX); const dc=$('#drawcut'); dc.style.display='block';
      const move=ev=>{ const t1=tAt(ev.clientX); const a=Math.min(t0,t1),b=Math.max(t0,t1);
        dc.style.left=(a/dur*100)+'%'; dc.style.width=((b-a)/dur*100)+'%'; };
      const up=ev=>{ document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        dc.style.display='none'; const t1=tAt(ev.clientX); const a=Math.min(t0,t1),b=Math.max(t0,t1);
        if(b-a>0.1){ cuts.push({start:a,end:b}); cuts.sort((x,y)=>x.start-y.start); updateCutInfo(); refresh(); } };
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    }else{
      vid.currentTime=Math.min(outT,Math.max(inT,tAt(e.clientX)));
    }
  });

  // captions (timed + positioned)
  $('#addCap').onclick=()=>{ const s=Math.min(vid.currentTime||0,Math.max(0,(dur||0)-0.5)); const c={id:Date.now(),text:'Caption',x:.5,y:.85,size:6,color:'#ffffff',start:s,end:Math.min(dur||s+3,s+3)}; captions.push(c); selCap=c.id; syncCapEditor(); renderCapList(); renderCaps(); $('#capText').focus(); $('#capText').select(); };
  $('#capText').oninput=()=>{ const c=selectedCap(); if(c){c.text=$('#capText').value; renderCapList(); renderCaps();} };
  $('#capColor').oninput=()=>{ const c=selectedCap(); if(c){c.color=$('#capColor').value; renderCaps();} };
  $('#capSize').oninput=()=>{ $('#capSizeV').textContent=$('#capSize').value+'%'; const c=selectedCap(); if(c){c.size=+$('#capSize').value; renderCaps();} };
  const clampCap=()=>{ const c=selectedCap(); if(!c)return;
    let st=+$('#capStartN').value, en=+$('#capEndN').value;
    if(isNaN(st))st=0; if(isNaN(en))en=dur;
    st=Math.max(0,Math.min(st,dur)); en=Math.max(0,Math.min(en,dur));
    if(en<=st)en=Math.min(dur,st+0.2);
    c.start=st; c.end=en; $('#capRange').textContent=`Shows ${fmt(st)} → ${fmt(en)}`; renderCapList(); renderCaps(); };
  $('#capStartN').oninput=clampCap; $('#capEndN').oninput=clampCap;
  $('#capStart').onclick=()=>{ const c=selectedCap(); if(c){ c.start=Math.min(vid.currentTime,c.end-0.1); syncCapEditor(); renderCapList(); renderCaps(); } };
  $('#capEnd').onclick=()=>{ const c=selectedCap(); if(c){ c.end=Math.max(vid.currentTime,c.start+0.1); syncCapEditor(); renderCapList(); renderCaps(); } };

  // speed (presets + custom)
  $('#speed').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
    document.querySelectorAll('#speed .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    if(c.dataset.s==='custom'){ $('#customSpeedField').style.display='block'; speed=+$('#customSpeed').value||1; }
    else { $('#customSpeedField').style.display='none'; speed=+c.dataset.s; }
    vid.playbackRate=speed; refresh();};
  $('#customSpeed').oninput=()=>{ let v=+$('#customSpeed').value; if(!v||v<0.1)v=0.1; if(v>8)v=8; speed=v; vid.playbackRate=speed; refresh(); };

  // audio
  $('#mute').onchange=e=>{vid.muted=e.target.checked;};
  $('#vol').oninput=()=>{vid.volume=Math.min(1,+$('#vol').value);$('#volV').textContent=Math.round($('#vol').value*100)+'%';};

  // adjust
  ['bri','con','sat'].forEach(id=>$('#'+id).oninput=()=>{
    $('#'+id+'V').textContent=Math.round($('#'+id).value*100)+'%'; applyPreviewFilter();});
  $('#resetAdj').onclick=()=>{['bri','con','sat'].forEach(id=>{$('#'+id).value=1;$('#'+id+'V').textContent='100%';});applyPreviewFilter();};

  // annotations (#21)
  $('#addBox').onclick=()=>{ annotations.push({type:'box',x:.3,y:.3,w:.4,h:.25,color:$('#annColor').value}); renderAnnotations(); };
  $('#addArrow').onclick=()=>{ annotations.push({type:'arrow',x:.25,y:.3,w:.4,h:.3,color:$('#annColor').value}); renderAnnotations(); };

  // cut (#19) — drag-to-cut mode
  $('#cutMode').onclick=()=>{ cutMode=!cutMode; $('#cutMode').classList.toggle('on',cutMode);
    $('#cutMode').textContent='✂ Drag-to-cut: '+(cutMode?'On':'Off'); $('#track').classList.toggle('cutmode',cutMode); };
  $('#clearCut').onclick=()=>{ cuts=[]; updateCutInfo(); refresh(); };

  $('#export').onclick=exportAll;
  window.addEventListener('resize',()=>{renderCaps();renderAnnotations();paintWave();});
}
function setPlaying(p){playing=p;$('#play').innerHTML=p
  ?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';}
function togglePlay(){
  if(playing){vid.pause();setPlaying(false);}
  else{ if(vid.currentTime<inT||vid.currentTime>=outT)vid.currentTime=inT; vid.playbackRate=speed; vid.play(); setPlaying(true);}
}
function dragHandle(el,isIn){
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId);
    const r=$('#track').getBoundingClientRect();
    const move=ev=>{
      let t=(ev.clientX-r.left)/r.width*dur;
      if(isIn) inT=Math.min(Math.max(0,t),outT-0.1);
      else outT=Math.max(Math.min(dur,t),inT+0.1);
      vid.currentTime=isIn?inT:outT; refresh();
    };
    const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    e.preventDefault();e.stopPropagation();
  });
}

/* ---------- export: multi-ratio canvas re-encode (#27) with cut (#19) + annotations (#21) ---------- */
async function exportAll(){
  const btn=$('#export'); btn.disabled=true; $('#bar').style.display='block';
  const ratios=[...document.querySelectorAll('#ratios input:checked')].map(c=>c.value);
  if(!ratios.length){ $('#status').textContent='Pick at least one export ratio.'; btn.disabled=false; return; }
  try{
    let done=0;
    for(const rk of ratios){
      $('#status').textContent=`Rendering ${rk==='original'?'original':rk} (${done+1}/${ratios.length})…`;
      const {blob,ext}=await renderOne(rk, p=>{$('#bar i').style.width=((done+p)/ratios.length*100)+'%';});
      const id=Date.now()+done;
      await putClip({id,blob,label:`${clip.label} · ${rk==='original'?'edited':rk}`,file:`reframe-edit-${rk.replace(':','x')}-${id}.${ext}`});
      done++;
    }
    $('#bar i').style.width='100%';
    $('#status').innerHTML=`✅ ${ratios.length} clip(s) saved to Recordings. <a href="index.html" style="color:#a9b1f0;font-weight:600">View →</a>`;
  }catch(err){ console.error(err); $('#status').textContent='Export failed: '+err.message; }
  finally{ btn.disabled=false; }
}

function renderOne(ratioKey, onProgress){
  return new Promise(async (resolve,reject)=>{
   try{
    const tmp=document.createElement('video'); tmp.src=URL.createObjectURL(clip.blob); tmp.playsInline=true;
    tmp.muted=$('#mute').checked;   // muted export can autoplay without a gesture
    await new Promise(r=>tmp.addEventListener('loadedmetadata',r,{once:true}));
    const sw=tmp.videoWidth, sh=tmp.videoHeight;
    let ow,oh;
    if(ratioKey==='original'){ ow=sw; oh=sh; }
    else{ const [rw,rh]=ratioKey.split(':').map(Number); const L=Math.max(sw,sh);
      if(rh>=rw){ oh=L; ow=Math.round(oh*rw/rh); } else { ow=L; oh=Math.round(ow*rh/rw); } }
    ow-=ow%2; oh-=oh%2;
    const cv=document.createElement('canvas'); cv.width=ow; cv.height=oh; const ctx=cv.getContext('2d');
    const stream=cv.captureStream(30);
    let actx=null;
    if(!$('#mute').checked){ actx=new AudioContext(); const s=actx.createMediaElementSource(tmp);
      const g=actx.createGain(); g.gain.value=+$('#vol').value; const d=actx.createMediaStreamDestination();
      s.connect(g).connect(d); d.stream.getAudioTracks().forEach(t=>stream.addTrack(t)); }
    const mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const chunks=[]; const rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    const stopped=new Promise(res=>rec.onstop=res);

    const fStr=filterStr();
    // video draw rect inside output (contain); reframed ratios get a blurred fill
    let VR;
    if(ratioKey==='original') VR={dx:0,dy:0,dw:ow,dh:oh,fill:false};
    else{ const s=Math.min(ow/sw,oh/sh), dw=sw*s, dh=sh*s; VR={dx:(ow-dw)/2,dy:(oh-dh)/2,dw,dh,fill:true}; }

    function drawCaptions(t){
      captions.forEach(c=>{
        if(t<c.start || t>=c.end || !c.text) return;
        const tsize=VR.dh*(c.size/100);
        ctx.save(); ctx.font=`700 ${tsize}px Inter, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle=c.color; ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=tsize*0.3; ctx.shadowOffsetY=tsize*0.06;
        const cx=VR.dx+c.x*VR.dw, cy=VR.dy+c.y*VR.dh;
        const maxW=VR.dw*0.9, words=c.text.split(/\s+/); let line='',lines=[];
        words.forEach(w=>{ if(ctx.measureText(line+w).width>maxW && line){lines.push(line.trim());line=w+' ';} else line+=w+' ';});
        lines.push(line.trim());
        const lh=tsize*1.2, startY=cy-(lines.length-1)*lh/2;
        lines.forEach((ln,i)=>ctx.fillText(ln,cx,startY+i*lh));
        ctx.restore();
      });
    }
    function drawAnnos(){
      annotations.forEach(a=>{
        ctx.save(); ctx.strokeStyle=a.color; ctx.fillStyle=a.color; ctx.lineWidth=Math.max(3,VR.dw*0.006); ctx.lineCap='round';
        if(a.type==='box'){ ctx.strokeRect(VR.dx+a.x*VR.dw, VR.dy+a.y*VR.dh, a.w*VR.dw, a.h*VR.dh); }
        else{
          const x1=VR.dx+a.x*VR.dw, y1=VR.dy+a.y*VR.dh, x2=VR.dx+(a.x+a.w)*VR.dw, y2=VR.dy+(a.y+a.h)*VR.dh;
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
          const ang=Math.atan2(y2-y1,x2-x1), hl=Math.max(12,VR.dw*0.03);
          ctx.beginPath(); ctx.moveTo(x2,y2);
          ctx.lineTo(x2-hl*Math.cos(ang-0.5),y2-hl*Math.sin(ang-0.5));
          ctx.lineTo(x2-hl*Math.cos(ang+0.5),y2-hl*Math.sin(ang+0.5));
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      });
    }

    tmp.playbackRate=speed; tmp.currentTime=inT;
    await new Promise(r=>tmp.addEventListener('seeked',r,{once:true}));
    rec.start(); tmp.play();

    // driven by setInterval so it keeps progressing even if the tab is hidden
    let lastSeekTarget=-1; const SEEK_EPS=Math.max(0.04, 1/30);
    const ivId=setInterval(()=>{
      // #19 skip any removed regions (forward-only + epsilon so frame-snapping can't re-trigger the same cut)
      const ce=cuts.find(c=>tmp.currentTime>=c.start && tmp.currentTime<c.end);
      if(ce && ce.end>lastSeekTarget+0.05){ lastSeekTarget=ce.end; tmp.currentTime=Math.min(outT, ce.end+SEEK_EPS); }
      if(VR.fill){
        const s=Math.max(ow/sw,oh/sh), bw=sw*s, bh=sh*s;
        ctx.filter='blur(28px)'; ctx.drawImage(tmp,(ow-bw)/2,(oh-bh)/2,bw,bh); ctx.filter='none';
        ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(0,0,ow,oh);
      }else{ ctx.fillStyle='#000'; ctx.fillRect(0,0,ow,oh); }
      ctx.filter=fStr; ctx.drawImage(tmp, VR.dx,VR.dy,VR.dw,VR.dh); ctx.filter='none';
      drawAnnos(); drawCaptions(tmp.currentTime);
      onProgress && onProgress(Math.min(1,(tmp.currentTime-inT)/Math.max(.001,outT-inT)));
      if(tmp.currentTime>=outT || tmp.ended){ clearInterval(ivId); tmp.pause(); rec.stop(); if(actx)actx.close(); }
    }, 1000/30);
    await stopped;
    const actual=rec.mimeType||mime||'video/webm'; const ext=actual.includes('mp4')?'mp4':'webm';
    resolve({blob:new Blob(chunks,{type:actual}),ext});
   }catch(e){ reject(e); }
  });
}
</script>
